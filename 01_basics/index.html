<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_basics</title>
</head>

<body>
    <h1>JavaScript基礎</h1>
    <p>開発者ツールのConsole（コンソール）を開いて結果を確認してください。</p>
    <script>
        // １行コメント
        /*
        複数行コメント
        */
        console.log('js!', 123);
        console.warn('warn');
        console.error('error');
        console.table(['apple', 'banana']);

        // const name = 'takayanagi';
        let name;
        console.log(name)
        name = 'takagi';
        console.log(name);

        // 算術演算子
        console.log(6 + 9);
        console.log(10 - 15);
        console.log(10 / (5 + 3));
        console.log(7 % 3);
        console.log(3 ** 2);

        let x = 1;
        /*
        x+1だけでは変数の値は変わらない
        値を更新するときは必ず計算した結果を代入しなければならない（下記のような書き方）
        */
        x = x + 1;
        console.log(x);
        // x = x * 100　と同じ意味
        x += 100;
        console.log(x);
        // x = x + 1　と同じ意味　インクリメント　-（マイナス）バージョンはデクリメント
        x++;
        console.log(x);

        // 型を調べる
        console.log(typeof x);
        console.log(x + 'dent');

        const person = `takayanagi`;
        const point = 120;
        // ${}内で計算することも可能
        console.log(`こんにちは、${person}さん。点数は${point}です`);
    </script>
</body>

</html>
